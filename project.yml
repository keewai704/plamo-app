name: Kotoba

options:
  minimumXcodeGenVersion: "2.46.0"
  bundleIdPrefix: jp.keewai
  deploymentTarget:
    iOS: "18.4"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.4"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_STRICT_CONCURRENCY: minimal
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO

packages:
  PLaMoKit:
    path: PLaMoKit

targets:
  PLaMoTranslate:
    type: application
    platform: iOS
    sources:
      - path: PLaMoTranslate
        excludes:
          - Info.plist
          - PLaMoTranslate.entitlements
      - path: LlamaRuntime
    dependencies:
      - target: PLaMoTranslateExtension
      - package: PLaMoKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.keewai.kotoba
        PRODUCT_NAME: Kotoba
        INFOPLIST_FILE: PLaMoTranslate/Info.plist
        CODE_SIGN_ENTITLEMENTS: PLaMoTranslate/PLaMoTranslate.entitlements
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        FRAMEWORK_SEARCH_PATHS[sdk=iphoneos*]: "$(inherited) $(SRCROOT)/vendor/llama/llama.xcframework/ios-arm64"
        OTHER_LDFLAGS[sdk=iphoneos*]: "$(inherited) -framework llama"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS[sdk=iphoneos*]: "$(inherited) LLAMA_REQUIRED"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
    postBuildScripts:
      - name: Embed llama.framework
        basedOnDependencyAnalysis: false
        shell: /bin/bash
        script: |
          set -euo pipefail
          if [ "${PLATFORM_NAME:-}" != "iphoneos" ]; then
            echo "Skipping llama.framework embed (platform=${PLATFORM_NAME:-unknown})"
            exit 0
          fi
          SOURCE="${SRCROOT}/vendor/llama/llama.xcframework/ios-arm64/llama.framework"
          if [ ! -d "${SOURCE}" ]; then
            echo "error: ${SOURCE} is missing. Run 'make fetch-llama'." >&2
            exit 1
          fi
          DESTINATION="${TARGET_BUILD_DIR}/${FRAMEWORKS_FOLDER_PATH}"
          mkdir -p "${DESTINATION}"
          rm -rf "${DESTINATION}/llama.framework"
          ditto "${SOURCE}" "${DESTINATION}/llama.framework"
          if [ "${CODE_SIGNING_ALLOWED:-YES}" = "YES" ] && [ -n "${EXPANDED_CODE_SIGN_IDENTITY:-}" ]; then
            codesign --force --sign "${EXPANDED_CODE_SIGN_IDENTITY}" "${DESTINATION}/llama.framework"
          fi

  PLaMoTranslateExtension:
    type: extensionkit-extension
    platform: iOS
    sources:
      - path: PLaMoTranslateExtension
        excludes:
          - Info.plist
          - PLaMoTranslateExtension.entitlements
      - path: LlamaRuntime
    dependencies:
      - package: PLaMoKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.keewai.kotoba.TranslationProvider
        INFOPLIST_FILE: PLaMoTranslateExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: PLaMoTranslateExtension/PLaMoTranslateExtension.entitlements
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        FRAMEWORK_SEARCH_PATHS[sdk=iphoneos*]: "$(inherited) $(SRCROOT)/vendor/llama/llama.xcframework/ios-arm64"
        OTHER_LDFLAGS[sdk=iphoneos*]: "$(inherited) -framework llama"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS[sdk=iphoneos*]: "$(inherited) LLAMA_REQUIRED"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../../Frameworks"

  KotobaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/KotobaTests
    dependencies:
      - package: PLaMoKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.keewai.kotoba.tests
        GENERATE_INFOPLIST_FILE: YES

  KotobaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/KotobaUITests
    dependencies:
      - target: PLaMoTranslate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.keewai.kotoba.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: PLaMoTranslate

schemes:
  PLaMoTranslate:
    build:
      targets:
        PLaMoTranslate: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - KotobaTests
        - KotobaUITests
    archive:
      config: Release
