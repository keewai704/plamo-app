      <select id="target" aria-label="翻訳先の言語"></select>

          <circle cx="12" cy="12" r="3" />

    </header>
    <button id="page" class="page" aria-pressed="false">
      <span id="page-label">このページを翻訳</span>
      <small>Alt+Shift+T</small>
    </button>
    <p id="note" class="note" hidden></p>
    <script src="popup.js"></script>
  </body>
</html>
