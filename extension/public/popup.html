<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>Kotoba</title>
    <link rel="stylesheet" href="ui.css" />
  </head>
  <body class="popup">
    <header class="row">
      <select id="target" aria-label="翻訳先の言語"></select>
      <span id="server-status" class="status" role="status"></span>
      <button id="settings" class="icon" aria-label="設定" title="設定">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="3" />
          <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.9 2.9l-.1-.1a1.7 1.7 0 0 0-2.8 1.2V21a2 2 0 0 1-4 0v-.1a1.7 1.7 0 0 0-2.9-1.2l-.1.1a2 2 0 1 1-2.8-2.9l.1-.1a1.7 1.7 0 0 0-1.2-2.8H3a2 2 0 0 1 0-4h.1a1.7 1.7 0 0 0 1.2-2.9l-.1-.1a2 2 0 1 1 2.9-2.8l.1.1a1.7 1.7 0 0 0 1.9.3 1.7 1.7 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 2.9 1.2l.1-.1a2 2 0 1 1 2.8 2.9l-.1.1a1.7 1.7 0 0 0 1.2 2.8h.1a2 2 0 0 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z" />
        </svg>
      </button>
    </header>
    <textarea id="source" aria-label="原文" rows="5"></textarea>
    <div class="row actions">
      <button id="page" class="icon" aria-label="ページを翻訳" title="ページを翻訳" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z" />
          <path d="M14 2v6h6M8 13h8M8 17h5" />
        </svg>
      </button>
      <button id="stop" class="primary icon" aria-label="停止" title="停止" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect class="solid" x="6" y="6" width="12" height="12" rx="2" /></svg>
      </button>
      <button id="translate" class="primary">翻訳</button>
    </div>
    <div class="result">
      <output id="output" aria-live="polite"></output>
      <button id="copy" class="icon" aria-label="コピー" title="コピー" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="9" y="9" width="12" height="12" rx="2" />
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
        </svg>
      </button>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
