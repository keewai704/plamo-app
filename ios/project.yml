name: Kotoba

options:
  minimumXcodeGenVersion: "2.46.0"
  bundleIdPrefix: jp.keewai
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: NO

packages:
  KotobaCore:
    path: KotobaCore

targets:
  Kotoba:
    type: application
    platform: iOS
    sources:
      - path: Kotoba
        excludes:
          - Info.plist
    dependencies:
      - package: KotobaCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.keewai.kotoba
        PRODUCT_NAME: Kotoba
        INFOPLIST_FILE: Kotoba/Info.plist
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  KotobaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: KotobaUITests
    dependencies:
      - target: Kotoba
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.keewai.kotoba.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Kotoba

schemes:
  Kotoba:
    build:
      targets:
        Kotoba: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - KotobaUITests
    archive:
      config: Release
