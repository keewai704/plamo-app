name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload a TestFlight build"
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  LLAMA_TAG: b12121

jobs:
  testflight:
    name: TestFlight
    if: startsWith(github.ref, 'refs/tags/v') || inputs.upload
    runs-on: macos-26
    environment: release
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Prepare environment
        run: echo "ASC_KEY_PATH=${RUNNER_TEMP}/AuthKey.p8" >> "$GITHUB_ENV"

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - uses: ./.github/actions/ios-setup

      - name: Restore llama.cpp archive
        uses: actions/cache@v4
        with:
          path: .build/llama
          key: llama-xcframework-${{ env.LLAMA_TAG }}

      - name: Fetch runtime and generate project
        run: |
          make fetch-llama
          make generate

      - name: Restore build cache
        uses: actions/cache@v4
        with:
          path: .build/DerivedData/Build
          key: dd-release-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            dd-release-${{ runner.os }}-

      - name: Resolve version
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "MARKETING_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "MARKETING_VERSION=0.1.0" >> "$GITHUB_ENV"
          fi

      - name: Check signing secrets
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT_BASE64: ${{ secrets.ASC_KEY_CONTENT_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=0
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_CONTENT_BASE64 APPLE_TEAM_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error::secret ${name} is not set"
              missing=1
            fi
          done
          exit "${missing}"

      - name: Write App Store Connect key
        env:
          ASC_KEY_CONTENT_BASE64: ${{ secrets.ASC_KEY_CONTENT_BASE64 }}
        run: |
          umask 077
          printf '%s' "${ASC_KEY_CONTENT_BASE64}" | openssl base64 -d -A > "${ASC_KEY_PATH}"

      - name: Verify (simulator unit tests)
        run: make build-for-testing test-unit

      - name: Build and upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_IDENTIFIER: jp.keewai.kotoba
        run: bundle exec fastlane ios beta

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            build/artifacts/*.ipa
            build/artifacts/*.dSYM.zip
            .build/Logs/*.xcresult
          if-no-files-found: warn
          retention-days: 14
