name: Release

# Everything is built and attached to a GitHub Release.
# Store uploads run only when their secrets are configured.

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  extension:
    name: Extension
    needs: ci
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 30
    env:
      KOTOBA_VERSION: ${{ github.ref_name }}
      AMO_API_KEY: ${{ secrets.AMO_API_KEY }}
      AMO_API_SECRET: ${{ secrets.AMO_API_SECRET }}
      EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
      CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
      CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
      REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - run: npm ci

      - name: Build
        run: |
          export KOTOBA_VERSION="${KOTOBA_VERSION#v}"
          npm run build
          npm run package

      - name: Sign for Firefox
        if: env.AMO_API_KEY != '' && env.AMO_API_SECRET != ''
        run: |
          npx web-ext sign --source-dir dist/firefox --artifacts-dir artifacts \
            --channel unlisted --api-key "${AMO_API_KEY}" --api-secret "${AMO_API_SECRET}"

      - name: Upload to the Chrome Web Store
        if: env.EXTENSION_ID != '' && env.CLIENT_ID != '' && env.CLIENT_SECRET != '' && env.REFRESH_TOKEN != ''
        run: npx --yes chrome-webstore-upload-cli@4.0.2 upload --source artifacts/kotoba-chrome.zip --auto-publish

      - uses: actions/upload-artifact@v7
        with:
          name: release-extension
          path: |
            extension/artifacts/*.zip
            extension/artifacts/*.xpi
          if-no-files-found: error

  ios:
    name: TestFlight
    needs: ci
    runs-on: macos-26
    environment: release
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_CONTENT_BASE64: ${{ secrets.ASC_KEY_CONTENT_BASE64 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    defaults:
      run:
        working-directory: ios
    steps:
      - name: Skip without signing secrets
        if: env.ASC_KEY_ID == ''
        working-directory: .
        run: echo "::notice::App Store Connect secrets are not set; skipping TestFlight."

      - uses: actions/checkout@v7
        if: env.ASC_KEY_ID != ''

      - uses: ruby/setup-ruby@v1.338.0
        if: env.ASC_KEY_ID != ''
        with:
          ruby-version: "3.4"
          bundler-cache: true
          working-directory: ios

      - uses: ./.github/actions/ios-setup
        if: env.ASC_KEY_ID != ''

      - name: Build and upload
        if: env.ASC_KEY_ID != ''
        run: |
          key_path="${RUNNER_TEMP}/AuthKey.p8"
          (umask 077; printf '%s' "${ASC_KEY_CONTENT_BASE64}" | openssl base64 -d -A > "${key_path}")
          export ASC_KEY_PATH="${key_path}" MARKETING_VERSION="${GITHUB_REF_NAME#v}"
          make generate
          bundle exec fastlane ios beta

      - uses: actions/upload-artifact@v7
        if: env.ASC_KEY_ID != ''
        with:
          name: release-ios
          path: |
            ios/build/artifacts/*.ipa
            ios/build/artifacts/*.dSYM.zip
          if-no-files-found: error

  publish:
    name: GitHub Release
    needs: [extension, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: assets
          pattern: release-*
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          (cd assets && shasum -a 256 -- * > SHA256SUMS)
          gh release create "${GITHUB_REF_NAME}" --title "Kotoba ${GITHUB_REF_NAME}" --generate-notes assets/*
