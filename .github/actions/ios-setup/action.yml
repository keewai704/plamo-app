name: iOS setup
description: Selects Xcode and restores a cached XcodeGen binary.

inputs:
  xcodegen-version:
    description: XcodeGen release tag.
    required: false
    default: "2.46.0"

runs:
  using: composite
  steps:
    - name: Select Xcode
      uses: maxim-lobanov/setup-xcode@v1.7.0
      with:
        xcode-version: latest-stable

    - name: Restore XcodeGen
      id: cache
      uses: actions/cache@v6
      with:
        path: .ci/tools
        key: xcodegen-${{ runner.os }}-${{ inputs.xcodegen-version }}

    - name: Install XcodeGen
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        mkdir -p .ci/tools
        curl -fsSL -o "${RUNNER_TEMP}/xcodegen.zip" "https://github.com/yonaskolb/XcodeGen/releases/download/${{ inputs.xcodegen-version }}/xcodegen.zip"
        echo "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  ${RUNNER_TEMP}/xcodegen.zip" | shasum -a 256 -c -
        ditto -x -k "${RUNNER_TEMP}/xcodegen.zip" .ci/tools

    - name: Add XcodeGen to PATH
      shell: bash
      run: echo "${{ github.workspace }}/.ci/tools/xcodegen/bin" >> "$GITHUB_PATH"
